<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Плейлисты и аккорды</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212;
    color: #eee;
    padding: 12px;
    padding-bottom: 40px;
  }
  h1 { font-size: 20px; margin: 8px 0 16px; text-align: center; }

  .card {
    background: #1e1e1e;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  label { display: block; font-size: 14px; color: #aaa; margin-bottom: 6px; }

  /* Кнопки выбора блока */
  .blocks { display: flex; gap: 8px; }
  .blocks button {
    flex: 1;
    padding: 14px 0;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #2c2c2c;
    color: #eee;
    transition: background 0.15s;
  }
  .blocks button.active { background: #e91e63; color: #fff; }

  /* Плейлист */
  .playlist { list-style: none; margin: 0; padding: 0; }
  .playlist li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 10px;
    border-bottom: 1px solid #2a2a2a;
    font-size: 16px;
  }
  .playlist li:last-child { border-bottom: none; }
  .playlist li .song {
    flex: 1;
    cursor: pointer;
  }
  .playlist li .song:active { color: #e91e63; }
  .playlist li .del {
    background: none;
    border: none;
    color: #777;
    font-size: 20px;
    padding: 4px 8px;
    cursor: pointer;
  }

  /* Добавление песни */
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row select, .add-row button {
    padding: 12px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
  }
  .add-row select { flex: 1; background: #2c2c2c; color: #eee; }
  .add-row button { background: #e91e63; color: #fff; font-weight: 600; }

  /* Кнопка очистки блока */
  .clear-btn {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #444;
    border-radius: 10px;
    background: #2c2c2c;
    color: #ff6b6b;
    cursor: pointer;
  }
  .clear-btn:active { background: #3a1e1e; }

  /* Третье окно — аккорды */
  #chordsBox { display: none; }
  #chordsBox .back {
    background: none;
    border: none;
    color: #e91e63;
    font-size: 16px;
    padding: 6px 0;
    margin-bottom: 8px;
    cursor: pointer;
  }
  #chordsTitle { font-size: 18px; font-weight: 700; margin: 4px 0 10px; }
  #chordsText {
    width: 100%;
    min-height: 260px;
    background: #161616;
    color: #ddd;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
  }
  .hint { font-size: 12px; color: #666; margin-top: 6px; text-align: center; }
</style>
</head>
<body>

<h1>🎸 Плейлисты и аккорды</h1>

<!-- ВЫБОР БЛОКА -->
<div class="card">
  <label>Блок</label>
  <div class="blocks" id="blocks"></div>
</div>

<!-- ПЛЕЙЛИСТ -->
<div class="card" id="playlistCard">
  <label>Плейлист блока <span id="currentBlock"></span></label>
  <ul class="playlist" id="playlist"></ul>
  <div class="add-row">
    <select id="songSelect"></select>
    <button id="addBtn">＋</button>
  </div>
  <button class="clear-btn" id="clearBtn">Очистить блок</button>
</div>

<!-- АККОРДЫ -->
<div class="card" id="chordsBox">
  <button class="back" id="backBtn">← Назад к плейлисту</button>
  <div id="chordsTitle"></div>
  <textarea id="chordsText" placeholder="Здесь будут аккорды и текст песни..."></textarea>
  <div class="hint">Текст сохраняется автоматически</div>
</div>

<script>
/* ====== СПИСОК ВСЕХ ПЕСЕН ====== */
const ALL_SONGS = [
  "All what she wants — Ace of Base",
  "Навернопотомучто - Время и стекло",
  "Половина сердца — Л. Агутин",
  "П.М.М.Л — Земфира",
  "GAZ — Zivert",
  "Аэропорты — Л. Агутин",
  "Отпускай — Три дня дождя",
  "Районы-кварталы — Звери",
  "Non stop — Reflex",
  "Остров — Л. Агутин",
  "Ночь — А. Губин",
  "Солнышко — Demo",
  "Седьмой лепесток — Антон Токарев",
  "Поезда — Женя Трофимов и «Комната культуры»",
  "Мало тебя — Serebro",
  "Царица — Анна Асти",
  "Sweet dreams — Eurythmics",
  "Я сошла с ума — Тату",
  "Широка река — Н. Кадышева",
  "Понарошку — Тима Акимов",
  "Привет — Ю. Савичева",
  "Любочка — Маша и медведи",
  "Медведица — Мумий-Тролль",
  "Искала — Земфира",
  "Угонщица — И. Аллегрова",
  "Кукла колдуна — КиШ",
  "Знаешь ли ты — МакSим"
];

/* ====== СОСТОЯНИЕ ====== */
const STORAGE_KEY = "playlists_v1";
let state = loadState();
let currentBlock = 1;
let currentSong = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    blocks: {
      1: [],
      2: [],
      3: [],
      4: []
    },
    chords: {} // { "название песни": "текст аккордов" }
  };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ====== ОТРИСОВКА БЛОКОВ ====== */
const blocksEl = document.getElementById("blocks");
[1,2,3,4].forEach(n => {
  const b = document.createElement("button");
  b.textContent = n;
  b.onclick = () => { currentBlock = n; hideChords(); render(); };
  blocksEl.appendChild(b);
});

/* ====== ОТРИСОВКА ПЛЕЙЛИСТА ====== */
function render() {
  // активная кнопка блока
  [...blocksEl.children].forEach((b, i) => {
    b.classList.toggle("active", i + 1 === currentBlock);
  });
  document.getElementById("currentBlock").textContent = currentBlock;

  // список песен блока
  const list = document.getElementById("playlist");
  list.innerHTML = "";
  const songs = state.blocks[currentBlock] || [];
  if (songs.length === 0) {
    const li = document.createElement("li");
    li.style.color = "#666";
    li.textContent = "Плейлист пуст — добавьте песни ниже";
    list.appendChild(li);
  }
  songs.forEach((song, idx) => {
    const li = document.createElement("li");

    const span = document.createElement("span");
    span.className = "song";
    span.textContent = song;
    span.onclick = () => openChords(song);

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = (e) => {
      e.stopPropagation();
      state.blocks[currentBlock].splice(idx, 1);
      saveState();
      render();
    };

    li.appendChild(span);
    li.appendChild(del);
    list.appendChild(li);
  });

  // выпадающий список для добавления
  const sel = document.getElementById("songSelect");
  sel.innerHTML = '<option value="">— выберите песню —</option>';
  ALL_SONGS.forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    sel.appendChild(o);
  });
}

/* ====== ДОБАВЛЕНИЕ ПЕСНИ ====== */
document.getElementById("addBtn").onclick = () => {
  const sel = document.getElementById("songSelect");
  if (!sel.value) return;
  if (!state.blocks[currentBlock]) state.blocks[currentBlock] = [];
  state.blocks[currentBlock].push(sel.value);
  saveState();
  sel.value = "";
  render();
};

/* ====== ОЧИСТКА БЛОКА ====== */
document.getElementById("clearBtn").onclick = () => {
  const songs = state.blocks[currentBlock] || [];
  if (songs.length === 0) {
    alert("Блок уже пуст.");
    return;
  }
  if (confirm("Очистить блок " + currentBlock + "? Все песни из него будут удалены.")) {
    state.blocks[currentBlock] = [];
    saveState();
    render();
  }
};

/* ====== ТРЕТЬЕ ОКНО (АККОРДЫ) ====== */
function openChords(song) {
  currentSong = song;
  document.getElementById("chordsTitle").textContent = song;
  document.getElementById("chordsText").value = state.chords[song] || "";
  document.getElementById("playlistCard").style.display = "none";
  document.getElementById("chordsBox").style.display = "block";
  window.scrollTo(0, 0);
}

function hideChords() {
  currentSong = null;
  document.getElementById("playlistCard").style.display = "block";
  document.getElementById("chordsBox").style.display = "none";
}

document.getElementById("backBtn").onclick = hideChords;

/* автосохранение аккордов */
document.getElementById("chordsText").addEventListener("input", (e) => {
  if (!currentSong) return;
  state.chords[currentSong] = e.target.value;
  saveState();
});

/* ====== СТАРТ ====== */
render();
</script>

</body>
</html>
